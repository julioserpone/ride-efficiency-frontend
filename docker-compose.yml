# Development stack for the Ride Efficiency SPA.
#
#   docker compose up --build      # start Vite with hot module replacement
#   docker compose logs -f web     # follow the dev server output
#
# The API lives in the `ride-efficiency-api` stack. This file joins that
# project's Docker network and publishes the frontend under the alias
# `frontend`, so the API's `CORS_ALLOWED_ORIGINS` can list
# `http://frontend:5173` as well as `http://localhost:5173`. If the API
# network cannot be found, adjust `API_NETWORK` in your shell or `.env`.
name: ride-efficiency-frontend

services:
    web:
        build:
            context: .
            target: development
        image: ride-efficiency-frontend:dev
        container_name: ride-efficiency-frontend
        restart: unless-stopped
        ports:
            - '${FRONTEND_PORT:-5173}:5173'
        environment:
            # Vite reads VITE_* from the process environment as well as from
            # `.env`, and process values win — so this is the single source of
            # truth inside the container.
            VITE_API_URL: ${VITE_API_URL:-http://localhost/api/v1}
            CHOKIDAR_USEPOLLING: 'true'
        volumes:
            # Source code is bind-mounted for hot reload; the dependency and
            # build directories stay inside the image/volume so the host
            # macOS binaries never leak into the Linux container.
            - .:/app
            - /app/node_modules
        tty: true
        networks:
            - default
            - api

networks:
    api:
        external: true
        name: ${API_NETWORK:-ride-efficiency-api_sail}
